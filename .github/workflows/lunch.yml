name: Update Lunch Menus

on:
  schedule:
    - cron: '22 5 *  * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-lunch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build
        run: mvn package -q -DskipTests

      - name: Install Playwright browsers
        run: java -cp target/lunch-1.0-SNAPSHOT-jar-with-dependencies.jar com.microsoft.playwright.CLI install --with-deps chromium

      - name: Run scraper
        run: java -jar target/lunch-1.0-SNAPSHOT-jar-with-dependencies.jar

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          commit_message: "lunch: update menus ${{ github.run_id }}"
